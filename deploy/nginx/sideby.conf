server {
    listen 80;
    server_name _;

    # Build frontend with `pnpm build`, then copy frontend/dist here.
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Replace this upstream with the backend address in your deployment.
        # No trailing slash: the original /api/... path is preserved.
        proxy_pass http://sideby-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

